services:
  app:
    image: ghcr.io/yvan2xero/tkams:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tkams}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tkams}
      DATABASE_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tkams}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_COOKIE_SAMESITE: lax
      BETTER_AUTH_COOKIE_SECURE: "false"
      CORS_ORIGINS: ${APP_URL}
      SERVER_PUBLIC_URL: ${APP_URL}
      SERVE_FRONTEND: "true"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /usr/src/app/apps/server/storage/uploads
      STORAGE_LOCAL_PUBLIC_PATH: /uploads
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@local.lan}
      RUN_SEED: ${RUN_SEED:-false}
      # Seed via mounted YAML files (takes priority over SEED_ORG_* vars below)
      SEED_FOUNDATION: ${SEED_FOUNDATION:-}
      SEED_ACADEMICS: ${SEED_ACADEMICS:-}
      SEED_USERS: ${SEED_USERS:-}
      # Seed via env vars (fallback when SEED_FOUNDATION is empty)
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-}
      SEED_ORG_TYPE: ${SEED_ORG_TYPE:-university}
      SEED_ORG_COUNTRY: ${SEED_ORG_COUNTRY:-CM}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - uploads:/usr/src/app/apps/server/storage/uploads
      - ./seeds:/seeds:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tkams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tkams}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
