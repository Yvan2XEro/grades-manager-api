name: Build and Push Images

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FULL_IMAGE: ghcr.io/yvan2xero/tkams

jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd ../.. && bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  docker:
    name: Build & Push (${{ matrix.app }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: full
            image: ghcr.io/yvan2xero/tkams
            dockerfile: Dockerfile.full
          - app: secondary
            image: ghcr.io/yvan2xero/tkams-secondary
            dockerfile: apps/secondary/Dockerfile
          - app: website
            image: ghcr.io/yvan2xero/tkams-website
            dockerfile: apps/website/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags generated per event:
      #   push to dev    → dev, dev-<sha>
      #   push to main   → main, <sha>, latest
      #   push tag v1.2.3 → 1.2.3, 1.2, 1, latest
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Website redeploy ────────────────────────────────────────────────────
  # The tkams.com compose stack (docker-compose.yml) runs the pre-built
  # website image. Dokploy pulls the new one from its deploy webhook; it
  # answers 301 "Branch Not Match" unless the payload reads as a GitHub push
  # to the branch the app tracks, hence the push-shaped body. Skipped until
  # the WEBSITE_DOKPLOY_DEPLOY_URL secret is set.
  deploy-website:
    name: Deploy website
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.WEBSITE_DOKPLOY_DEPLOY_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "::notice::WEBSITE_DOKPLOY_DEPLOY_URL is not set, skipping the redeploy"
            exit 0
          fi
          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg msg "$COMMIT_MESSAGE" \
            '{ref: $ref, after: $sha, head_commit: {id: $sha, message: $msg}}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$payload" "$DOKPLOY_DEPLOY_URL")
          cat response.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy answered HTTP $status"
            exit 1
          fi
