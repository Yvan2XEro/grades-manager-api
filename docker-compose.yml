# Production deployment — TKAMS portal (tkams.com)
# Deployed as a Compose stack in Dokploy (uses Traefik for routing + SSL).
#
# First deploy:
#   cp .env.website .env
#   fill in secrets, then:
#   docker compose pull && docker compose up -d
#
# Update to latest image:
#   docker compose pull && docker compose up -d --no-deps website

services:
  website:
    image: ghcr.io/yvan2xero/tkams-website:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/tkams-website
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://tkams.com
      WEBSITE_URL: https://tkams.com
      DOKPLOY_URL: ${DOKPLOY_URL}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY}
      DOKPLOY_APP_IMAGE: ${DOKPLOY_APP_IMAGE:-ghcr.io/yvan2xero/tkams:latest}
      TKAMS_BASE_DOMAIN: tkams.com
      NEXT_PUBLIC_TKAMS_BASE_DOMAIN: tkams.com
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY}
      NOTCHPAY_HASH_KEY: ${NOTCHPAY_HASH_KEY}
    networks:
      - dokploy-network
      - internal
    depends_on:
      - mongo
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTPS — serves both apex and www (Next.js handles www→apex redirect internally)
      - "traefik.http.routers.tkams-website.rule=Host(`tkams.com`) || Host(`www.tkams.com`)"
      - "traefik.http.routers.tkams-website.entrypoints=websecure"
      - "traefik.http.routers.tkams-website.tls=true"
      - "traefik.http.routers.tkams-website.tls.certresolver=letsencrypt"
      - "traefik.http.services.tkams-website.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.tkams-website-http.rule=Host(`tkams.com`) || Host(`www.tkams.com`)"
      - "traefik.http.routers.tkams-website-http.entrypoints=web"
      - "traefik.http.routers.tkams-website-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    restart: unless-stopped

networks:
  # Traefik's shared network — must already exist on the Dokploy host
  dokploy-network:
    external: true
  # Internal network — website <-> mongo, not exposed to Traefik
  internal:

volumes:
  mongo_data:
